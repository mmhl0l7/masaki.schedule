<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>橋本将生 マガジン・出演番組一覧</title>
<style>
  :root {
    --pastel-base: #fdf6f9;
    --main-color: #ff69b4;
    --deep-color: #d81b60;
    --border-color: #fce4ec;
    --card-bg: #ffffff;
    --tag-bg: #fff0f5;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--pastel-base);
    margin: 0;
    padding: 10px;
    color: #333;
  }
  .app-container {
    width: 100%;
    max-width: 500px;
    margin: 0 auto;
    box-sizing: border-box;
  }

  /* アプリ内カスタム通知モーダル */
  .custom-toast-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.4);
    z-index: 9999;
    justify-content: center;
    align-items: center;
  }
  .custom-toast-box {
    background: #fff;
    border: 3px solid var(--main-color);
    border-radius: 20px;
    padding: 20px;
    width: 85%;
    max-width: 320px;
    box-shadow: 0 6px 20px rgba(255,105,180,0.3);
    text-align: center;
    animation: popIn 0.2s ease-out;
  }
  @keyframes popIn {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .toast-icon { font-size: 30px; margin-bottom: 6px; }
  .toast-title { font-size: 15px; font-weight: bold; color: var(--deep-color); margin-bottom: 8px; }
  .toast-body { font-size: 12px; color: #555; margin-bottom: 16px; line-height: 1.5; white-space: pre-wrap; }
  .toast-close-btn {
    background: var(--main-color);
    color: #fff;
    border: none;
    padding: 8px 20px;
    border-radius: 16px;
    font-weight: bold;
    cursor: pointer;
    font-size: 12px;
  }

  /* プロフィール・リンクカード */
  .profile-card {
    background: #fff;
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(255,105,180,0.06);
    position: relative;
  }
  .profile-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .profile-avatar {
    width: 45px;
    height: 45px;
    background: #fce4ec;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    border: 2px solid var(--main-color);
  }
  .profile-name-area h2 {
    font-size: 15px;
    color: var(--deep-color);
    margin: 0 0 2px 0;
  }
  .profile-name-area p {
    font-size: 11px;
    color: #666;
    margin: 0;
  }
  .profile-edit-trigger {
    display: none;
    position: absolute;
    top: 14px;
    right: 14px;
    background: #e3f2fd;
    color: #1565c0;
    border: 1px solid #bbdefb;
    padding: 3px 8px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: bold;
    cursor: pointer;
  }
  .profile-edit-trigger.show {
    display: block;
  }

  .profile-links-grid {
    display: flex;
    flex-direction: column;
    gap: 6px;
    border-top: 1px dashed var(--border-color);
    padding-top: 10px;
  }
  .profile-link-row {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .profile-link-label {
    font-size: 10px;
    font-weight: bold;
    color: var(--deep-color);
    background: var(--tag-bg);
    padding: 3px 8px;
    border-radius: 8px;
    min-width: 85px;
    text-align: center;
  }
  .profile-link-btn {
    font-size: 10px;
    background: #fff;
    color: #555;
    border: 1px solid var(--border-color);
    padding: 3px 8px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
  }
  .profile-link-btn:hover {
    border-color: var(--main-color);
    color: var(--deep-color);
  }

  /* 今日のTOPIC（映画カウントダウン対応） */
  .today-topic-card {
    background: linear-gradient(135deg, #ff80ab, #ff4081);
    color: #fff;
    border-radius: 16px;
    padding: 12px 16px;
    margin-bottom: 12px;
    box-shadow: 0 4px 12px rgba(255, 64, 129, 0.3);
  }
  .topic-label {
    font-size: 10px;
    background: rgba(255,255,255,0.3);
    padding: 2px 8px;
    border-radius: 10px;
    display: inline-block;
    font-weight: bold;
    margin-bottom: 4px;
  }
  .topic-title {
    font-size: 13px;
    font-weight: bold;
    line-height: 1.4;
  }

  /* ヘッダー */
  .header-top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .app-title-text {
    font-size: 15px;
    font-weight: bold;
    color: var(--deep-color);
  }
  .notification-status-badge {
    background: #fff;
    border: 1px solid var(--border-color);
    padding: 4px 10px;
    border-radius: 14px;
    font-size: 11px;
    font-weight: bold;
    color: var(--deep-color);
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
  }

  /* 上部タブ */
  .type-tabs {
    display: flex;
    background: #f8bbd0;
    border-radius: 24px;
    padding: 4px;
    margin-bottom: 12px;
  }
  .type-tab {
    flex: 1;
    text-align: center;
    padding: 10px;
    font-size: 12px;
    font-weight: bold;
    color: #880e4f;
    border-radius: 20px;
    cursor: pointer;
    background: transparent;
    border: none;
  }
  .type-tab.active {
    background: #ffffff;
    color: var(--deep-color);
    box-shadow: 0 2px 6px rgba(216, 27, 96, 0.2);
  }

  /* 月切り替え */
  .month-nav-container {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .month-nav {
    flex: 1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fff;
    border: 1px solid var(--border-color);
    border-radius: 20px;
    padding: 6px 12px;
    font-weight: bold;
    color: var(--deep-color);
  }
  .month-nav button {
    background: var(--tag-bg);
    border: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    cursor: pointer;
    color: var(--deep-color);
    font-weight: bold;
  }
  .today-jump-btn {
    background: #fff;
    border: 1px solid var(--main-color);
    color: var(--deep-color);
    padding: 0 14px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: 0 2px 5px rgba(255,105,180,0.15);
  }

  /* フィルターセクション */
  .filter-section {
    background: #fff;
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 10px;
    margin-bottom: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .filter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    align-items: center;
  }
  .filter-pill {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 14px;
    border: 1px solid var(--border-color);
    background: #fff;
    color: #555;
    cursor: pointer;
    font-weight: bold;
  }
  .filter-pill.active {
    background: var(--deep-color);
    color: #fff;
    border-color: var(--deep-color);
  }

  /* ビュー切り替えバー */
  .view-mode-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .view-switch {
    display: flex;
    background: #fce4ec;
    border-radius: 16px;
    padding: 3px;
  }
  .view-btn {
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 14px;
    border: none;
    background: transparent;
    color: var(--deep-color);
    font-weight: bold;
    cursor: pointer;
  }
  .view-btn.active {
    background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }

  /* 日付グループ */
  .date-group-header {
    font-size: 14px;
    font-weight: bold;
    color: var(--deep-color);
    margin: 16px 0 8px 4px;
    border-bottom: 2px solid #fce4ec;
    padding-bottom: 4px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .today-badge-inline {
    background: var(--main-color);
    color: #fff;
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 8px;
    font-weight: bold;
  }

  /* アイテムカード */
  .item-card {
    background: var(--card-bg);
    border: 1px solid #f8bbd0;
    border-radius: 16px;
    padding: 12px;
    margin-bottom: 10px;
    box-shadow: 0 2px 8px rgba(255, 105, 180, 0.08);
  }
  .item-header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
  }
  .item-title {
    font-size: 14px;
    font-weight: bold;
    color: #222;
    flex: 1;
  }
  .purchase-status-badge {
    font-size: 10px;
    padding: 4px 8px;
    border-radius: 12px;
    border: 1px solid #ccc;
    background: #f8f9fa;
    color: #555;
    cursor: pointer;
    font-weight: bold;
    white-space: nowrap;
  }
  .purchase-status-badge.done {
    background: #e2f0d9;
    color: #385723;
    border-color: #b7e1cd;
  }

  .item-footer-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    flex-wrap: wrap;
    gap: 6px;
  }
  .badges-left {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    align-items: center;
  }
  .status-tag {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    color: #fff;
    font-weight: bold;
  }
  .status-tag.pub-res { background: #ff69b4; }
  .member-tag {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    background: #fff0f5;
    color: var(--deep-color);
    border: 1px solid #f8bbd0;
    font-weight: bold;
  }
  .date-range-display {
    font-size: 10px;
    color: #666;
    background: #fdf0f5;
    padding: 2px 6px;
    border-radius: 6px;
    border: 1px dashed var(--main-color);
    margin-bottom: 6px;
    display: inline-block;
  }

  .links-container {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    align-items: center;
  }
  .shop-link-btn {
    font-size: 10px;
    background: #fff0f5;
    color: var(--deep-color);
    border: 1px solid var(--main-color);
    padding: 3px 8px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: bold;
  }

  .item-action-icons {
    display: none;
    gap: 5px;
  }
  .item-action-icons.show {
    display: flex;
  }
  .icon-btn {
    background: #f9f9fc;
    border: 1px solid var(--border-color);
    padding: 3px 8px;
    border-radius: 10px;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    text-decoration: none;
    color: #555;
    font-weight: bold;
  }
  .edit-icon-btn { background: #e3f2fd; color: #1565c0; border-color: #bbdefb; }
  .delete-icon-btn { background: #ffebee; color: #c62828; border-color: #ffcdd2; }

  /* 登録・編集フォーム共通スタイル */
  .form-container {
    display: none;
    background: #fff;
    border: 2px solid var(--main-color);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 16px;
  }
  .form-group { margin-bottom: 8px; }
  .form-group label { font-size: 11px; font-weight: bold; color: var(--deep-color); display: block; margin-bottom: 2px; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 6px; border: 1px solid var(--border-color); border-radius: 8px; box-sizing: border-box; font-size: 12px; }
  .submit-btn { background: var(--main-color); color: #fff; border: none; width: 100%; padding: 8px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 6px; }
  .cancel-edit-btn { background: #ccc; color: #fff; border: none; width: 100%; padding: 6px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 4px; font-size: 11px; }

  /* カレンダー表示モード */
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
    background: #fff;
    padding: 8px;
    border-radius: 16px;
    border: 1px solid var(--border-color);
  }
  .cal-cell {
    min-height: 55px;
    border: 1px solid #eee;
    border-radius: 6px;
    padding: 2px;
    font-size: 9px;
    background: #fafafa;
    overflow: hidden;
    cursor: pointer;
  }
  .cal-cell.has-event { background: #fff0f5; border-color: var(--main-color); }
  .cal-cell.is-today { background: #ffe4ec !important; border: 2px solid var(--deep-color) !important; }
  .cal-day-num { font-weight: bold; color: #444; margin-bottom: 2px; display: inline-block; }
  .cal-cell.is-today .cal-day-num { background: var(--deep-color); color: #fff; border-radius: 50%; width: 15px; height: 15px; text-align: center; line-height: 15px; font-size: 8px; }
  .cal-event-dot { font-size: 7px; background: var(--main-color); color: #fff; padding: 1px 2px; border-radius: 3px; margin-bottom: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .cal-detail-drawer {
    margin-top: 12px;
    background: #fff;
    border: 2px solid var(--main-color);
    border-radius: 16px;
    padding: 12px;
  }
  .cal-detail-header {
    font-size: 13px;
    font-weight: bold;
    color: var(--deep-color);
    margin-bottom: 8px;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 4px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .no-data { text-align: center; color: #888; font-size: 12px; padding: 20px; background: #fff; border-radius: 12px; }

  /* 一番下の目立たない管理者リンク */
  .footer-admin-area {
    text-align: center;
    margin: 30px 0 15px 0;
  }
  .admin-footer-btn {
    background: none;
    border: none;
    color: #bbb;
    font-size: 10px;
    cursor: pointer;
    text-decoration: underline;
    padding: 5px;
  }
  .admin-footer-btn.logged-in {
    color: var(--deep-color);
    font-weight: bold;
    text-decoration: none;
  }
</style>
</head>
<body>

<!-- アプリ内カスタム通知用ポップアップ -->
<div class="custom-toast-overlay" id="custom-toast-overlay">
  <div class="custom-toast-box">
    <div class="toast-icon" id="toast-icon">✨</div>
    <div class="toast-title" id="toast-title">お知らせ</div>
    <div class="toast-body" id="toast-body">本文が入ります</div>
    <button class="toast-close-btn" onclick="closeCustomToast()">OK</button>
  </div>
</div>

<div class="app-container">

  <!-- ヘルパー上部バー -->
  <div class="header-top-bar">
    <div class="app-title-text">🩷 橋本将生 Schedule</div>
    <div class="notification-status-badge">🔔 通知機能: 稼働中</div>
  </div>

  <!-- プロフィール・各種リンクカード（別枠） -->
  <div class="profile-card">
    <button class="profile-edit-trigger" id="profile-edit-btn" onclick="openProfileEditModal()">✏️ プロフィール編集</button>
    <div class="profile-header">
      <div class="profile-avatar" id="pf-avatar-icon">🩷</div>
      <div class="profile-name-area">
        <h2 id="pf-display-name">橋本将生 (Masaki Hashimoto)</h2>
        <p id="pf-display-sub">プロフィール＆関連リンクまとめ</p>
      </div>
    </div>
    <div class="profile-links-grid" id="profile-links-container">
      <!-- JavaScriptで動的生成 -->
    </div>
  </div>

  <!-- プロフィール編集用フォーム -->
  <div class="form-container" id="profile-form">
    <div style="font-size: 13px; font-weight: bold; color: var(--deep-color); margin-bottom: 8px;">✏️ プロフィール・リンク編集</div>
    <div class="form-group"><label>名前（英語表記など含む）</label><input type="text" id="input-pf-name" value="橋本将生 (Masaki Hashimoto)"></div>
    <div class="form-group"><label>サブタイトル/説明</label><input type="text" id="input-pf-sub" value="プロフィール＆関連リンクまとめ"></div>
    <div class="form-group"><label>アイコン絵文字</label><input type="text" id="input-pf-icon" value="🩷"></div>
    <div class="form-group">
      <label>リンク設定 (例: 表示名=URL, 表示名2=URL)</label>
      <textarea id="input-pf-links" rows="6" placeholder="各SNS: Instagram=https://..., いまさっきのまさき=https://...
アンバサダー: Gelée by Decorative Nail=https://..., クラフトフレッシュモッツァレラ=https://..."></textarea>
      <div style="font-size: 10px; color: #888; margin-top: 2px;">※「カテゴリ名: 表示名=URL, 表示名2=URL」の形式で入力してください。</div>
    </div>
    <button class="submit-btn" onclick="saveProfileData()">プロフィールを更新する</button>
    <button class="cancel-edit-btn" onclick="document.getElementById('profile-form').style.display='none'">キャンセル</button>
  </div>

  <!-- 今日のTOPIC（映画カウントダウン対応） -->
  <div class="today-topic-card" id="today-topic-box">
    <div class="topic-label" id="topic-label">✨ 映画公開カウントダウン</div>
    <div class="topic-title" id="topic-text">読み込み中...</div>
  </div>

  <!-- 上部タブ -->
  <div class="type-tabs">
    <button class="type-tab active" id="tab-magazine" onclick="switchMainType('MAGAZINE')">MAGAZINE</button>
    <button class="type-tab" id="tab-program" onclick="switchMainType('PROGRAM')">出演番組</button>
  </div>

  <!-- 月切り替え -->
  <div class="month-nav-container">
    <div class="month-nav">
      <button onclick="changeMonth(-1)">&lt;</button>
      <span id="month-display">2026年10月</span>
      <button onclick="changeMonth(1)">&gt;</button>
    </div>
    <button class="today-jump-btn" onclick="jumpToCurrentMonth()">🔄 今月</button>
  </div>

  <!-- フィルターセクション -->
  <div class="filter-section">
    <div class="filter-row" id="member-filters">
      <button class="filter-pill active" onclick="toggleMemberFilter('すべて')">すべて</button>
      <button class="filter-pill" onclick="toggleMemberFilter('橋本将生')">橋本将生</button>
    </div>
    <div class="filter-row" id="status-filters"></div>
  </div>

  <!-- ビュー切り替えバー -->
  <div class="view-mode-bar">
    <div class="view-switch">
      <button class="view-btn active" id="view-list-btn" onclick="switchView('list')">リスト</button>
      <button class="view-btn" id="view-cal-btn" onclick="switchView('calendar')">カレンダー</button>
    </div>
  </div>

  <!-- 登録・編集フォーム -->
  <div class="form-container" id="admin-form">
    <div style="font-size: 13px; font-weight: bold; color: var(--deep-color); margin-bottom: 8px;" id="form-heading-text">📖 橋本将生 スケジュール追加</div>
    <input type="hidden" id="edit-item-id" value="">
    
    <div class="form-group"><label>日付（雑誌は発売日）</label><input type="date" id="input-date"></div>
    <div class="form-group" id="group-end-date" style="display:none;"><label>終了日（期間の場合のみ）</label><input type="date" id="input-end-date"></div>
    <div class="form-group" id="group-time"><label>時間（例: 20:00 ※番組用）</label><input type="time" id="input-time" value="20:00"></div>
    
    <div class="form-group"><label>タイトル</label><input type="text" id="input-title" placeholder="雑誌名または番組名・話数"></div>
    <div class="form-group">
      <label>カテゴリ</label>
      <select id="input-type" onchange="onFormTypeChange()">
        <option value="MAGAZINE">MAGAZINE</option>
        <option value="PROGRAM">出演番組</option>
      </select>
    </div>
    <div class="form-group">
      <label>ステータス</label>
      <select id="input-status"></select>
    </div>
    <div class="form-group">
      <label>関連リンク（複数可）</label><input type="text" id="input-links" placeholder="例: Amazon:https://amazon.co.jp/...">
    </div>
    <button class="submit-btn" id="form-submit-btn" onclick="saveItemData()">登録する</button>
    <button class="cancel-edit-btn" id="form-cancel-btn" style="display:none;" onclick="resetFormToCreateMode()">キャンセル</button>
  </div>

  <!-- メインコンテンツ表示エリア -->
  <div id="content-area"></div>

  <!-- 一番下の目立たない管理者ログイン -->
  <div class="footer-admin-area">
    <button class="admin-footer-btn" id="admin-toggle-btn" onclick="checkAdminAndToggleForm()">⚙️ 管理者ログイン</button>
  </div>

</div>

<script>
  const realNow = new Date();
  let currentYear = realNow.getFullYear();
  let currentMonth = realNow.getMonth();

  let currentMainType = "MAGAZINE";
  let currentMemberFilters = ["すべて"];
  let currentStatusFilters = ["すべて"];
  let currentViewMode = "list";
  let isAdminLoggedIn = false;
  let selectedCalDate = null;

  let profileData = {
    name: "橋本将生 (Masaki Hashimoto)",
    sub: "プロフィール＆関連リンクまとめ",
    icon: "🩷",
    sections: [
      {
        category: "各SNS",
        links: [
          {name: "Instagram", url: "https://www.instagram.com/masaki.hashimoto.1017?stkn=MTZjemxhNmdhZTE3Ng=="},
          {name: "いまさっきのまさき", url: "https://web.familyclub.jp/s/jwb/diary/F2033?ima"}
        ]
      },
      {
        category: "アンバサダー",
        links: [
          {name: "Gelée by Decorative Nail", url: "https://x.com/geleebynail?s=21"},
          {name: "クラフトフレッシュモッツァレラ", url: "https://www.morinagamilk.co.jp/products/brand/mozzarella/harenohi/"}
        ]
      },
      {
        category: "公式SNS",
        links: [
          {name: "スタッフX", url: "https://x.com"},
          {name: "公式YouTube", url: "https://youtube.com"}
        ]
      }
    ]
  };

  let itemsData = [
    { 
      id: 1, type: "MAGAZINE", date: "2026-10-01", endDate: "", time: "", title: "J Movie Magazine Vol.135 (表紙)", status: "表紙", member: "橋本将生", 
      links: [{name: "Amazon", url: "https://amazon.co.jp"}], 
      purchased: false, notifiedRelease: false
    },
    { 
      id: 2, type: "PROGRAM", date: "2026-10-03", endDate: "2026-10-05", time: "21:00", title: "〇〇テレビ特別展（公開期間）", status: "ゲスト出演", member: "橋本string", 
      links: [{name: "TVer", url: "https://tver.jp"}], 
      purchased: false, notified10m: false, notifiedDay: false
    }
  ];

  document.getElementById("month-display").textContent = `${currentYear}年${currentMonth + 1}月`;
  
  window.addEventListener('load', () => {
    renderProfileCard();
    updateStatusFilterPills();
    updateFormStatusOptions();
    updateFormVisibilityBytype();
    updateTodayTopic();
    
    setTimeout(triggerStartupAlert, 600);
    setInterval(checkNotificationTimers, 60000);
  });

  function renderProfileCard() {
    document.getElementById("pf-display-name").textContent = profileData.name;
    document.getElementById("pf-display-sub").textContent = profileData.sub;
    document.getElementById("pf-avatar-icon").textContent = profileData.icon;

    const container = document.getElementById("profile-links-container");
    container.innerHTML = "";

    profileData.sections.forEach(sec => {
      let row = document.createElement("div");
      row.className = "profile-link-row";
      
      let labelSpan = document.createElement("span");
      labelSpan.className = "profile-link-label";
      labelSpan.textContent = sec.category;
      row.appendChild(labelSpan);

      sec.links.forEach(l => {
        let a = document.createElement("a");
        a.href = l.url;
        a.target = "_blank";
        a.className = "profile-link-btn";
        a.textContent = l.name;
        row.appendChild(a);
      });

      container.appendChild(row);
    });
  }

  function openProfileEditModal() {
    document.getElementById("input-pf-name").value = profileData.name;
    document.getElementById("input-pf-sub").value = profileData.sub;
    document.getElementById("input-pf-icon").value = profileData.icon;

    let textLines = [];
    profileData.sections.forEach(sec => {
      let linksStr = sec.links.map(l => `${l.name}=${l.url}`).join(", ");
      textLines.push(`${sec.category}: ${linksStr}`);
    });
    document.getElementById("input-pf-links").value = textLines.join("\n");

    const form = document.getElementById("profile-form");
    form.style.display = "block";
    form.scrollIntoView({ behavior: 'smooth' });
  }

  function saveProfileData() {
    profileData.name = document.getElementById("input-pf-name").value;
    profileData.sub = document.getElementById("input-pf-sub").value;
    profileData.icon = document.getElementById("input-pf-icon").value;

    let rawText = document.getElementById("input-pf-links").value;
    let newSections = [];

    rawText.split("\n").forEach(line => {
      line = line.trim();
      if (!line) return;
      if (line.includes(":")) {
        let colonIdx = line.indexOf(":");
        let cat = line.substring(0, colonIdx).trim();
        let rest = line.substring(colonIdx + 1).trim();
        let links = [];

        rest.split(",").forEach(itemPart => {
          itemPart = itemPart.trim();
          if (!itemPart) return;
          if (itemPart.includes("=")) {
            let eqIdx = itemPart.indexOf("=");
            let lName = itemPart.substring(0, eqIdx).trim();
            let lUrl = itemPart.substring(eqIdx + 1).trim();
            links.push({ name: lName, url: lUrl });
          } else {
            links.push({ name: itemPart, url: itemPart });
          }
        });

        newSections.push({ category: cat, links: links });
      }
    });

    if (newSections.length > 0) {
      profileData.sections = newSections;
    }

    renderProfileCard();
    document.getElementById("profile-form").style.display = "none";
    alert("プロフィールを更新しました！");
  }

  function showCustomToast(icon, title, body) {
    document.getElementById("toast-icon").textContent = icon;
    document.getElementById("toast-title").textContent = title;
    document.getElementById("toast-body").textContent = body;
    document.getElementById("custom-toast-overlay").style.display = "flex";
  }

  function closeCustomToast() {
    document.getElementById("custom-toast-overlay").style.display = "none";
  }

  function triggerStartupAlert() {
    const todayStr = `${realNow.getFullYear()}-${String(realNow.getMonth() + 1).padStart(2, '0')}-${String(realNow.getDate()).padStart(2, '0')}`;
    const todayItems = itemsData.filter(i => {
      if (i.type === "MAGAZINE") {
        return i.date === todayStr;
      } else {
        let start = i.date;
        let end = i.endDate ? i.endDate : i.date;
        return todayStr >= start && todayStr <= end;
      }
    });

    if (todayItems.length > 0) {
      let titles = todayItems.map(i => `・${i.title} (${i.status})`).join("\n");
      showCustomToast("✨", "本日の推し活スケジュール", `本日予定されている項目があります：\n${titles}`);
    }
  }

  function checkNotificationTimers() {
    const now = new Date();
    const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

    itemsData.forEach(item => {
      if (item.type === "MAGAZINE") {
        if (item.date === todayStr && !item.notifiedRelease) {
          showCustomToast("📚", "本日発売日！", `「${item.title}」の発売日です！`);
          item.notifiedRelease = true;
        }
      } else {
        let targetDate = item.date;
        if (!targetDate || !item.time) return;

        if (targetDate === todayStr) {
          let [tHour, tMin] = item.time.split(":").map(Number);
          let [nHour, nMin] = [now.getHours(), now.getMinutes()];
          let targetTotalMins = tHour * 60 + tMin;
          let nowTotalMins = nHour * 60 + nMin;
          let diffMins = targetTotalMins - nowTotalMins;

          if (diffMins === 10 && !item.notified10m) {
            showCustomToast("⏰", "まもなく開始 (10分前)", `「${item.title}」がまもなく(${item.time})始まります！`);
            item.notified10m = true;
          }
          if (diffMins === 0 && !item.notifiedDay) {
            showCustomToast("🚀", "お時間です！", `「${item.title}」の時間になりました！`);
            item.notifiedDay = true;
          }
        }
      }
    });
  }

  function switchMainType(type) {
    currentMainType = type;
    currentStatusFilters = ["すべて"];
    selectedCalDate = null;
    document.getElementById("tab-magazine").classList.toggle("active", type === "MAGAZINE");
    document.getElementById("tab-program").classList.toggle("active", type === "PROGRAM");
    
    updateStatusFilterPills();
    if (!document.getElementById("edit-item-id").value) {
      document.getElementById("input-type").value = type;
      updateFormStatusOptions();
      updateFormVisibilityBytype();
    }
    render();
  }

  function onFormTypeChange() {
    updateFormStatusOptions();
    updateFormVisibilityBytype();
  }

  function updateFormVisibilityBytype() {
    const typeSelect = document.getElementById("input-type");
    const targetType = typeSelect ? typeSelect.value : currentMainType;
    const timeGroup = document.getElementById("group-time");
    const endDateGroup = document.getElementById("group-end-date");

    if (targetType === "MAGAZINE") {
      timeGroup.style.display = "none";
      endDateGroup.style.display = "none";
      document.getElementById("input-end-date").value = "";
    } else {
      timeGroup.style.display = "block";
      endDateGroup.style.display = "block";
    }
  }

  function updateStatusFilterPills() {
    const container = document.getElementById("status-filters");
    container.innerHTML = "";

    let statuses = ["すべて"];
    if (currentMainType === "MAGAZINE") {
      statuses.push("予約受付中", "表紙", "発売中", "重版");
    } else {
      statuses.push("放送予定", "レギュラー", "ゲスト出演");
    }

    statuses.forEach(st => {
      const btn = document.createElement("button");
      btn.className = "filter-pill" + (currentStatusFilters.includes(st) ? " active" : "");
      btn.textContent = st;
      btn.onclick = () => toggleStatusFilter(st);
      container.appendChild(btn);
    });
  }

  function updateFormStatusOptions(selectedStatus = null) {
    const typeSelect = document.getElementById("input-type");
    const targetType = typeSelect ? typeSelect.value : currentMainType;

    const statusSelect = document.getElementById("input-status");
    if (!statusSelect) return;
    
    statusSelect.innerHTML = "";
    let options = [];
    if (targetType === "MAGAZINE") {
      options = ["予約受付中", "表紙", "発売中", "重版"];
    } else {
      options = ["放送予定", "ゲスト出演", "レギュラー"];
    }

    options.forEach(opt => {
      const el = document.createElement("option");
      el.value = opt;
      el.textContent = opt;
      if (selectedStatus && opt === selectedStatus) el.selected = true;
      statusSelect.appendChild(el);
    });
  }

  function changeMonth(dir) {
    currentMonth += dir;
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    else if (currentMonth < 0) { currentMonth = 11; currentYear--; }
    selectedCalDate = null;
    document.getElementById("month-display").textContent = `${currentYear}年${currentMonth + 1}月`;
    render();
  }

  function jumpToCurrentMonth() {
    const now = new Date();
    currentYear = now.getFullYear();
    currentMonth = now.getMonth();
    selectedCalDate = null;
    document.getElementById("month-display").textContent = `${currentYear}年${currentMonth + 1}月`;
    render();
  }

  function toggleMemberFilter(member) {
    if (member === "すべて") {
      currentMemberFilters = ["すべて"];
    } else {
      if (currentMemberFilters.includes("すべて")) currentMemberFilters = [];
      const idx = currentMemberFilters.indexOf(member);
      if (idx > -1) currentMemberFilters.splice(idx, 1);
      else currentMemberFilters.push(member);
      if (currentMemberFilters.length === 0) currentMemberFilters = ["すべて"];
    }
    updateMultiPills("member-filters", currentMemberFilters);
    render();
  }

  function toggleStatusFilter(status) {
    if (status === "すべて") {
      currentStatusFilters = ["すべて"];
    } else {
      if (currentStatusFilters.includes("すべて")) currentStatusFilters = [];
      const idx = currentStatusFilters.indexOf(status);
      if (idx > -1) currentStatusFilters.splice(idx, 1);
      else currentStatusFilters.push(status);
      if (currentStatusFilters.length === 0) currentStatusFilters = ["すべて"];
    }
    updateStatusFilterPills();
    render();
  }

  function updateMultiPills(containerId, activeList) {
    const container = document.getElementById(containerId);
    Array.from(container.children).forEach(btn => {
      if (activeList.includes(btn.textContent)) btn.classList.add("active");
      else btn.classList.remove("active");
    });
  }

  function switchView(mode) {
    currentViewMode = mode;
    selectedCalDate = null;
    document.getElementById("view-list-btn").classList.toggle("active", mode === "list");
    document.getElementById("view-cal-btn").classList.toggle("active", mode === "calendar");
    render();
  }

  // 映画「お姉ちゃんの翠くん」の公開日カウントダウン設定（12月4日公開）
  function updateTodayTopic() {
    const topicLabel = document.getElementById("topic-label");
    const topicEl = document.getElementById("topic-text");
    
    const releaseDate = new Date("2026-12-04T00:00:00");
    const today = new Date();
    // 日付の差分を計算（ミリ秒から日数へ変換）
    const diffTime = releaseDate - today;
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

    topicLabel.textContent = "🎬 映画公開カウントダウン";
    if (diffDays > 0) {
      topicEl.textContent = `映画『お姉ちゃんの翠くん』公開まで あと ${diffDays} 日！ (12月4日公開)`;
    } else if (diffDays === 0) {
      topicEl.textContent = `🎉 本日公開！映画『お姉ちゃんの翠くん』おめでとうございます！`;
    } else {
      topicEl.textContent = `映画『お姉ちゃんの翠くん』大ヒット公開中！`;
    }
  }

  function checkAdminAndToggleForm() {
    if (!isAdminLoggedIn) {
      const pwd = prompt("管理者パスワードを入力してください：");
      if (pwd === "masaki123") {
        isAdminLoggedIn = true;
        const btn = document.getElementById("admin-toggle-btn");
        btn.textContent = "⚙️ 管理者モード中";
        btn.classList.add("logged-in");
        
        document.getElementById("profile-edit-btn").classList.add("show");

        alert("管理者としてログインしました！");
        render();
      } else {
        if (pwd !== null) alert("パスワードが違います");
        return;
      }
    }
    const form = document.getElementById("admin-form");
    if (form.style.display === "block" && document.getElementById("edit-item-id").value === "") {
      form.style.display = "none";
    } else {
      form.style.display = "block";
      if (!document.getElementById("edit-item-id").value) resetFormToCreateMode();
      form.scrollIntoView({ behavior: 'smooth' });
    }
  }

  function resetFormToCreateMode() {
    document.getElementById("edit-item-id").value = "";
    document.getElementById("form-heading-text").textContent = "📖 橋本将生 スケジュール追加";
    document.getElementById("form-submit-btn").textContent = "登録する";
    document.getElementById("form-cancel-btn").style.display = "none";
    document.getElementById("input-date").value = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-01`;
    document.getElementById("input-end-date").value = "";
    document.getElementById("input-time").value = "20:00";
    document.getElementById("input-title").value = "";
    document.getElementById("input-type").value = currentMainType;
    document.getElementById("input-links").value = "";
    updateFormStatusOptions();
    updateFormVisibilityBytype();
  }

  function editItem(id) {
    if (!isAdminLoggedIn) return;
    const item = itemsData.find(i => i.id === id);
    if (!item) return;

    document.getElementById("edit-item-id").value = item.id;
    document.getElementById("input-date").value = item.date;
    document.getElementById("input-end-date").value = item.endDate || "";
    document.getElementById("input-time").value = item.time || "20:00";
    document.getElementById("input-title").value = item.title;
    document.getElementById("input-type").value = item.type;
    updateFormStatusOptions(item.status);
    updateFormVisibilityBytype();

    let linkStrs = item.links.map(l => `${l.name}:${l.url}`).join(", ");
    document.getElementById("input-links").value = linkStrs;

    document.getElementById("form-heading-text").textContent = "✏️ スケジュール編集";
    document.getElementById("form-submit-btn").textContent = "更新する";
    document.getElementById("form-cancel-btn").style.display = "block";

    const form = document.getElementById("admin-form");
    form.style.display = "block";
    form.scrollIntoView({ behavior: 'smooth' });
  }

  function togglePurchase(id) {
    const item = itemsData.find(i => i.id === id);
    if (item) {
      item.purchased = !item.purchased;
      render();
    }
  }

  function deleteItem(id) {
    if (!isAdminLoggedIn) return;
    if (confirm("この項目を削除しますか？")) {
      itemsData = itemsData.filter(i => i.id !== id);
      updateTodayTopic();
      render();
    }
  }

  function parseLinks(inputStr) {
    if (!inputStr || !inputStr.trim()) return [];
    let result = [];
    inputStr.split(",").forEach(part => {
      part = part.trim();
      if (!part) return;
      if (part.includes(":")) {
        let colonIdx = part.indexOf(":");
        let name = part.substring(0, colonIdx).trim();
        let url = part.substring(colonIdx + 1).trim();
        if (url.startsWith("//")) url = "https:" + url;
        result.push({ name: name, url: url });
      } else {
        result.push({ name: "リンク", url: part });
      }
    });
    return result;
  }

  function saveItemData() {
    const editId = document.getElementById("edit-item-id").value;
    const date = document.getElementById("input-date").value;
    const type = document.getElementById("input-type").value;
    const endDate = type === "PROGRAM" ? document.getElementById("input-end-date").value : "";
    const time = type === "PROGRAM" ? document.getElementById("input-time").value : "";
    const title = document.getElementById("input-title").value;
    const status = document.getElementById("input-status").value;
    const linksRaw = document.getElementById("input-links").value;

    if (!date || !title) {
      alert("日付とタイトルを入力してください");
      return;
    }

    const parsedLinks = parseLinks(linksRaw);

    if (editId) {
      const item = itemsData.find(i => i.id == editId);
      if (item) {
        item.date = date;
        item.endDate = endDate;
        item.time = time;
        item.title = title;
        item.type = type;
        item.status = status;
        item.links = parsedLinks;
        item.notifiedRelease = false;
        item.notified10m = false;
        item.notifiedDay = false;
      }
      alert("更新しました！");
    } else {
      itemsData.push({
        id: Date.now(),
        type, date, endDate, time, title, status, member: "橋本将生", links: parsedLinks, 
        purchased: false, notifiedRelease: false, notified10m: false, notifiedDay: false
      });
      alert("追加しました！");
    }

    const dParts = date.split("-");
    currentYear = parseInt(dParts[0]);
    currentMonth = parseInt(dParts[1]) - 1;
    document.getElementById("month-display").textContent = `${currentYear}年${currentMonth + 1}月`;

    if (currentMainType !== type) switchMainType(type);

    document.getElementById("admin-form").style.display = "none";
    resetFormToCreateMode();
    updateTodayTopic();
    render();
  }

  function isItemInCurrentMonth(item) {
    let startStr = item.date;
    let endStr = item.endDate ? item.endDate : item.date;
    let startDate = new Date(startStr);
    let endDate = new Date(endStr);
    let monthStart = new Date(currentYear, currentMonth, 1);
    let monthEnd = new Date(currentYear, currentMonth + 1, 0);
    return startDate <= monthEnd && endDate >= monthStart;
  }

  function render() {
    const container = document.getElementById("content-area");
    container.innerHTML = "";

    let filtered = itemsData.filter(item => {
      if (item.type !== currentMainType) return false;
      if (!isItemInCurrentMonth(item)) return false;
      if (!currentStatusFilters.includes("すべて") && !currentStatusFilters.includes(item.status)) return false;
      return true;
    });

    if (currentViewMode === "calendar") {
      renderCalendarView(filtered, container);
    } else {
      renderListView(filtered, container);
    }
  }

  function createCardHtml(item) {
    const purchaseText = item.purchased ? "✓ 完了/済" : "○ 管理ステータス";
    const purchaseClass = item.purchased ? "purchase-status-badge done" : "purchase-status-badge";

    let dateInfoHtml = '';
    if (item.type === "MAGAZINE") {
      dateInfoHtml = `<div class="date-range-display">📚 発売日: ${item.date}</div>`;
    } else {
      if (item.endDate && item.endDate !== item.date) {
        dateInfoHtml = `<div class="date-range-display">📅 期間: ${item.date} 〜 ${item.endDate} (${item.time || ''})</div>`;
      } else {
        dateInfoHtml = `<div class="date-range-display">🕒 時間: ${item.time || '未設定'}</div>`;
      }
    }

    let linksHtml = '';
    if (item.links && item.links.length > 0) {
      linksHtml = `<div class="links-container">`;
      item.links.forEach(l => {
        linksHtml += `<a href="${l.url}" target="_blank" class="shop-link-btn">🔗 ${l.name}</a>`;
      });
      linksHtml += `</div>`;
    }

    const actionClass = isAdminLoggedIn ? "item-action-icons show" : "item-action-icons";

    return `
      <div class="item-card">
        <div class="item-header-row">
          <div class="item-title">${item.title}</div>
          <button class="${purchaseClass}" onclick="togglePurchase(${item.id})">${purchaseText}</button>
        </div>
        ${dateInfoHtml}
        <div class="item-footer-row">
          <div class="badges-left">
            <span class="status-tag pub-res">${item.status}</span>
            <span class="member-tag">橋本将生</span>
            ${linksHtml}
          </div>
          <div class="${actionClass}">
            <button class="icon-btn edit-icon-btn" onclick="editItem(${item.id})" title="編集">編集✏️</button>
            <button class="icon-btn delete-icon-btn" onclick="deleteItem(${item.id})" title="削除">削除✕</button>
          </div>
        </div>
      </div>
    `;
  }

  function renderListView(data, container) {
    if (data.length === 0) {
      container.innerHTML = `<div class="no-data">該当する予定はありません</div>`;
      return;
    }

    data.sort((a, b) => a.date.localeCompare(b.date));

    let grouped = {};
    data.forEach(item => {
      if (!grouped[item.date]) grouped[item.date] = [];
      grouped[item.date].push(item);
    });

    const todayStr = `${realNow.getFullYear()}-${String(realNow.getMonth() + 1).padStart(2, '0')}-${String(realNow.getDate()).padStart(2, '0')}`;

    Object.keys(grouped).sort().forEach(dateStr => {
      const dObj = new Date(dateStr);
      const dateHeader = document.createElement("div");
      dateHeader.className = "date-group-header";
      
      const weekdays = ["日", "月", "火", "水", "木", "金", "土"];
      let todayBadgeHtml = (dateStr === todayStr) ? `<span class="today-badge-inline">今日</span>` : '';
      
      dateHeader.innerHTML = `<span>${dObj.getDate()}(${weekdays[dObj.getDay()]})</span> ${todayBadgeHtml}`;
      container.appendChild(dateHeader);

      grouped[dateStr].forEach(item => {
        const wrapper = document.createElement("div");
        wrapper.innerHTML = createCardHtml(item);
        container.appendChild(wrapper.firstElementChild);
      });
    });
  }

  function renderCalendarView(data, container) {
    const calWrapper = document.createElement("div");
    calWrapper.className = "calendar-grid";

    const weekdays = ["日", "月", "火", "水", "木", "金", "土"];
    weekdays.forEach(w => {
      const wEl = document.createElement("div");
      wEl.style.textAlign = "center";
      wEl.style.fontWeight = "bold";
      wEl.style.fontSize = "10px";
      wEl.style.color = "var(--deep-color)";
      wEl.textContent = w;
      calWrapper.appendChild(wEl);
    });

    const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
    const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

    for (let i = 0; i < firstDayIndex; i++) {
      calWrapper.appendChild(document.createElement("div"));
    }

    let dayToItemsMap = {};
    for (let day = 1; day <= totalDays; day++) {
      let dayStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      let matchedItems = data.filter(item => {
        if (item.type === "MAGAZINE") {
          return item.date === dayStr;
        } else {
          let start = item.date;
          let end = item.endDate ? item.endDate : item.date;
          return dayStr >= start && dayStr <= end;
        }
      });
      if (matchedItems.length > 0) {
        dayToItemsMap[day] = matchedItems;
      }
    }

    for (let day = 1; day <= totalDays; day++) {
      const cell = document.createElement("div");
      cell.className = "cal-cell";
      if (dayToItemsMap[day]) cell.classList.add("has-event");

      const isTodayCell = (currentYear === realNow.getFullYear() && currentMonth === realNow.getMonth() && day === realNow.getDate());
      if (isTodayCell) cell.classList.add("is-today");

      const numEl = document.createElement("div");
      numEl.className = "cal-day-num";
      numEl.textContent = day;
      cell.appendChild(numEl);

      if (dayToItemsMap[day]) {
        dayToItemsMap[day].forEach(ev => {
          const dot = document.createElement("div");
          dot.className = "cal-event-dot";
          dot.textContent = ev.title;
          cell.appendChild(dot);
        });

        const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        cell.onclick = () => {
          selectedCalDate = dateStr;
          render();
        };
      }

      calWrapper.appendChild(cell);
    }

    container.appendChild(calWrapper);

    if (selectedCalDate) {
      const selDay = parseInt(selectedCalDate.split("-")[2]);
      const selMonth = parseInt(selectedCalDate.split("-")[1]) - 1;
      const selYear = parseInt(selectedCalDate.split("-")[0]);

      if (selYear === currentYear && selMonth === currentMonth && dayToItemsMap[selDay]) {
        const dayItems = dayToItemsMap[selDay];
        const drawer = document.createElement("div");
        drawer.className = "cal-detail-drawer";
        
        const dObj = new Date(selectedCalDate);
        const weekdaysFull = ["日", "月", "火", "水", "木", "金", "土"];
        
        let html = `
          <div class="cal-detail-header">
            <span>📅 ${dObj.getDate()}日(${weekdaysFull[dObj.getDay()]}) の詳細</span>
            <span style="cursor:pointer; font-size:11px;" onclick="selectedCalDate=null; render();">✕ 閉じる</span>
          </div>
        `;
        
        dayItems.forEach(item => {
          html += createCardHtml(item);
        });

        drawer.innerHTML = html;
        container.appendChild(drawer);
      }
    }
  }

  document.getElementById("input-date").value = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-01`;
  render();
</script>

</body>
</html>
