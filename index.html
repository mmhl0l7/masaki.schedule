<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💖 橋本将生 Schedule</title>
    <style>
        :root {
            --primary-pink: #e84393;
            --light-pink: #fce7f3;
            --bg-color: #fcf8fa;
            --card-bg: #ffffff;
            --text-color: #2d3748;
            --text-secondary: #718096;
            --border-color: #f1d3e2;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 12px;
            max-width: 480px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 4px 8px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--primary-pink);
        }
        .sync-icon {
            font-size: 0.95rem;
            cursor: pointer;
        }
        .header-right {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .notification-btn, .admin-login-btn {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            color: #4a5568;
            cursor: pointer;
        }
        .admin-login-btn.logged-in {
            background: var(--primary-pink);
            color: white;
            border-color: var(--primary-pink);
        }
        .countdown-banner {
            background: linear-gradient(135deg, #f472b6, #db2777);
            color: white;
            padding: 12px 16px;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 0.85rem;
            margin-bottom: 12px;
            box-shadow: 0 2px 4px rgba(232, 67, 147, 0.15);
        }
        .countdown-sub {
            font-size: 0.75rem;
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 8px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 4px;
        }
        .profile-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .profile-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .profile-avatar {
            width: 38px;
            height: 38px;
            background: var(--light-pink);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-pink);
            font-size: 1.1rem;
        }
        .profile-name {
            font-weight: bold;
            font-size: 0.9rem;
            color: #1a202c;
        }
        .profile-sub {
            font-size: 0.72rem;
            color: var(--text-secondary);
        }
        .open-btn {
            background: var(--light-pink);
            color: var(--primary-pink);
            border: none;
            padding: 4px 12px;
            border-radius: 14px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
        }
        .tabs-container {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            overflow-x: auto;
            padding-bottom: 2px;
        }
        .tab {
            background: white;
            border: 1px solid var(--border-color);
            color: var(--primary-pink);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            flex: 1;
            text-align: center;
        }
        .tab.active {
            background: var(--primary-pink);
            color: white;
        }
        .filter-section {
            background: white;
            padding: 10px 12px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .filter-row {
            display: flex;
            gap: 6px;
            overflow-x: auto;
        }
        .chip {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            color: #4a5568;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 0.75rem;
            cursor: pointer;
            white-space: nowrap;
        }
        .chip.active {
            background: var(--primary-pink);
            color: white;
            border-color: var(--primary-pink);
        }
        .view-switch {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }
        .view-btn {
            background: white;
            border: 1px solid #e2e8f0;
            color: var(--primary-pink);
            padding: 6px 18px;
            border-radius: 16px;
            font-size: 0.78rem;
            cursor: pointer;
            font-weight: bold;
        }
        .view-btn.active {
            background: var(--light-pink);
            border-color: var(--border-color);
        }
        .schedule-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 10px;
            position: relative;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        .schedule-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .schedule-date {
            font-size: 0.78rem;
            color: var(--primary-pink);
            font-weight: bold;
        }
        .status-pill {
            border: 1px solid #cbd5e1;
            background: #fff;
            padding: 3px 10px;
            border-radius: 14px;
            font-size: 0.7rem;
            color: #4a5568;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }
        .schedule-title {
            font-weight: bold;
            font-size: 0.92rem;
            color: #1a202c;
            margin-bottom: 8px;
        }
        .tags-row {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .tag {
            background: var(--light-pink);
            color: var(--primary-pink);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: bold;
        }
        /* 管理者専用エリア（初期非表示） */
        .admin-only {
            display: none;
        }
        .add-form-card {
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            margin-top: 16px;
        }
        .add-form-card h3 {
            font-size: 0.85rem;
            color: var(--primary-pink);
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.82rem;
            margin-bottom: 8px;
        }
        .submit-btn {
            background: var(--primary-pink);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            width: 100%;
            font-weight: bold;
            font-size: 0.82rem;
            cursor: pointer;
        }
        .backup-section {
            margin-top: 20px;
            border-top: 1px dashed #cbd5e1;
            padding-top: 14px;
            text-align: center;
        }
        .backup-btn {
            background: #475569;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.78rem;
            cursor: pointer;
            width: 100%;
            margin-bottom: 6px;
        }
        .delete-card-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 2px 6px;
            font-size: 0.65rem;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 6px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <span class="sync-icon">🔄</span>
            <span>💖 橋本将生 Schedule</span>
        </div>
        <div class="header-right">
            <button class="admin-login-btn" id="adminBtn" onclick="toggleAdminLogin()">🔐 管理者ログイン</button>
            <div class="notification-btn">🔔 通知</div>
        </div>
    </header>

    <div class="countdown-banner">
        <div class="countdown-sub">✨ 映画公開カウントダウン</div>
        <div>映画『お姉ちゃんの翠くん』公開まで あと 67 日！(12/4公開)</div>
    </div>

    <div class="profile-card">
        <div class="profile-left">
            <div class="profile-avatar">💖</div>
            <div>
                <div class="profile-name">橋本将生 (Masaki Hashimoto)</div>
                <div class="profile-sub">プロフィール＆関連リンクまとめ</div>
            </div>
        </div>
        <button class="open-btn">開く ▼</button>
    </div>

    <div class="tabs-container">
        <button class="tab active" onclick="switchTab(this)">MAGAZINE</button>
        <button class="tab" onclick="switchTab(this)">番組/映画</button>
        <button class="tab" onclick="switchTab(this)">イベント</button>
        <button class="tab" onclick="switchTab(this)">ココマサキ</button>
    </div>

    <div class="filter-section">
        <div class="filter-row">
            <button class="chip active">すべて</button>
            <button class="chip">橋本将生</button>
        </div>
        <div class="filter-row">
            <button class="chip active">すべて</button>
            <button class="chip">予約受付中</button>
            <button class="chip">表紙</button>
            <button class="chip">発売中</button>
            <button class="chip">重版</button>
            <button class="chip">CD発売</button>
        </div>
    </div>

    <div class="view-switch">
        <button class="view-btn active">リスト</button>
        <button class="view-btn">カレンダー</button>
    </div>

    <!-- スケジュール一覧 -->
    <div id="scheduleContainer"></div>

    <!-- 管理者専用：予定追加フォーム -->
    <div class="add-form-card admin-only" id="adminAddFormCard">
        <h3>➕ スケジュールの追加（管理者専用）</h3>
        <form id="addForm">
            <input type="date" id="inputDate" required value="2026-10-01">
            <input type="text" id="inputTitle" placeholder="タイトル（例: J Movie Magazine Vol.135 (表紙) ▼）" required>
            <input type="text" id="inputTags" placeholder="タグ（カンマ区切り：予約受付中, 表紙, 橋本将生）" value="予約受付中, 表紙, 橋本将生">
            <button type="submit" class="submit-btn">追加する</button>
        </form>
    </div>

    <!-- 管理者専用：バックアップ・復元エリア -->
    <div class="backup-section admin-only" id="adminBackupCard">
        <p style="font-size: 0.72rem; color: var(--text-secondary); margin-bottom: 6px;">
            ※管理者用データ管理
        </p>
        <button class="backup-btn" onclick="exportData()">データをファイルに保存（バックアップ）</button>
        <input type="file" id="importFile" accept=".json" onchange="importData(event)" style="font-size: 0.75rem;">
    </div>

    <script>
        const STORAGE_KEY = "masaki_schedule_exact_ui_data";
        const ADMIN_PASS = "masaki0927"; // 管理者パスワード（必要に応じて変更してください）
        let isAdminLoggedIn = false;

        const defaultData = [
            {
                date: "2026-10-01",
                title: "J Movie Magazine Vol.135 (表紙) ▼",
                tags: ["予約受付中", "表紙", "橋本将生"]
            }
        ];

        function loadData() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : defaultData;
        }

        function saveData(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function toggleAdminLogin() {
            if (isAdminLoggedIn) {
                if (confirm("管理者からログアウトしますか？")) {
                    isAdminLoggedIn = false;
                    document.getElementById("adminBtn").textContent = "🔐 管理者ログイン";
                    document.getElementById("adminBtn").classList.remove("logged-in");
                    updateAdminUI();
                    render();
                }
            } else {
                const input = prompt("管理者パスワードを入力してください：");
                if (input === ADMIN_PASS) {
                    isAdminLoggedIn = true;
                    document.getElementById("adminBtn").textContent = "🔓 管理者中 (ログアウト)";
                    document.getElementById("adminBtn").classList.add("logged-in");
                    updateAdminUI();
                    render();
                    alert("管理者としてログインしました。");
                } else if (input !== null) {
                    alert("パスワードが違います。");
                }
            }
        }

        function updateAdminUI() {
            const adminElements = document.querySelectorAll('.admin-only');
            adminElements.forEach(el => {
                el.style.display = isAdminLoggedIn ? "block" : "none";
            });
        }

        function render() {
            const items = loadData();
            const container = document.getElementById("scheduleContainer");
            if (!container) return;
            container.innerHTML = "";

            if (items.length === 0) {
                container.innerHTML = "<p style='text-align:center; color:#718096; font-size:0.8rem; padding:15px;'>予定はありません</p>";
                return;
            }

            items.forEach((item, index) => {
                const card = document.createElement("div");
                card.className = "schedule-card";

                let tagsHtml = "";
                if (item.tags && Array.isArray(item.tags)) {
                    tagsHtml = item.tags.map(t => `<span class="tag">${t}</span>`).join("");
                }

                // 管理者ログイン中のみ削除ボタンを表示
                let deleteBtnHtml = "";
                if (isAdminLoggedIn) {
                    deleteBtnHtml = `<button class="delete-card-btn" onclick="deleteItem(${index})">削除</button>`;
                }

                card.innerHTML = `
                    <div class="schedule-top-row">
                        <div class="schedule-date">📅 ${item.date}</div>
                        <div>
                            <button class="status-pill"><span>○</span> 管理ステータス</button>
                            ${deleteBtnHtml}
                        </div>
                    </div>
                    <div class="schedule-title">${escapeHTML(item.title)}</div>
                    <div class="tags-row">${tagsHtml}</div>
                `;
                container.appendChild(card);
            });
        }

        document.getElementById("addForm").addEventListener("submit", function(e) {
            e.preventDefault();
            if (!isAdminLoggedIn) return;

            const date = document.getElementById("inputDate").value;
            const title = document.getElementById("inputTitle").value;
            const tagsInput = document.getElementById("inputTags").value;
            const tags = tagsInput ? tagsInput.split(",").map(t => t.trim()).filter(t => t) : [];

            const items = loadData();
            items.push({ date, title, tags });
            saveData(items);

            this.reset();
            document.getElementById("inputDate").value = "2026-10-01";
            render();
            alert("スケジュールを追加しました！");
        });

        function deleteItem(index) {
            if (!isAdminLoggedIn) return;
            if (confirm("この予定を削除しますか？")) {
                const items = loadData();
                items.splice(index, 1);
                saveData(items);
                render();
            }
        }

        function switchTab(el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        function exportData() {
            if (!isAdminLoggedIn) return;
            const data = localStorage.getItem(STORAGE_KEY) || "[]";
            const blob = new Blob([data], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "masaki_schedule_backup_" + new Date().toISOString().slice(0, 10) + ".json";
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            if (!isAdminLoggedIn) return;
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (Array.isArray(parsed)) {
                        saveData(parsed);
                        render();
                        alert("復元が完了しました！");
                    } else {
                        alert("ファイル形式が異なります。");
                    }
                } catch(err) {
                    alert("読み込みに失敗しました。");
                }
            };
            reader.readAsText(file);
        }

        // 初期表示
        render();
    </script>
</body>
</html>
