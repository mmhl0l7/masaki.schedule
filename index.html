<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>橋本将生 Schedule</title>
    <style>
        :root {
            --primary-pink: #ff4081;
            --light-pink: #ffe4ec;
            --pale-pink: #fff0f5;
            --accent-pink: #e91e63;
            --text-color: #333333;
            --gray-border: #f0f0f0;
            --gray-text: #888888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--pale-pink);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: #ffffff;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 12px rgba(255, 64, 129, 0.1);
            position: relative;
        }

        /* ヘッダー */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .header-title {
            display: flex;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            color: var(--accent-pink);
            cursor: pointer;
            user-select: none;
        }

        .header-buttons {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .action-btn {
            background-color: #fff9fb;
            border: 1px solid var(--light-pink);
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 11px;
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        /* 更新ボタンのアニメーション用 */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .spin {
            animation: spin 0.8s linear;
        }

        /* カウントダウンバナー */
        .countdown-banner {
            background: linear-gradient(135deg, #ff65a3, #ff4081);
            color: white;
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            margin-bottom: 16px;
            box-shadow: 0 4px 10px rgba(255, 64, 129, 0.2);
        }

        .countdown-tag {
            display: inline-block;
            background-color: rgba(255, 255, 255, 0.3);
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-bottom: 6px;
        }

        .countdown-text {
            font-size: 13px;
            font-weight: bold;
        }

        /* プロフィールカード */
        .profile-card {
            background-color: #ffffff;
            border: 1px solid var(--light-pink);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .profile-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .profile-avatar {
            width: 44px;
            height: 44px;
            background-color: var(--light-pink);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }

        .profile-name {
            font-size: 14px;
            font-weight: bold;
            color: var(--accent-pink);
        }

        .profile-sub {
            font-size: 11px;
            color: var(--gray-text);
        }

        .profile-toggle {
            background-color: #ffffff;
            border: 1px solid var(--light-pink);
            color: var(--accent-pink);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
        }

        /* ナビゲーションタブ */
        .nav-tabs {
            display: flex;
            background-color: var(--light-pink);
            border-radius: 20px;
            padding: 4px;
            margin-bottom: 16px;
        }

        .nav-tab {
            flex: 1;
            text-align: center;
            padding: 8px 0;
            font-size: 12px;
            font-weight: bold;
            color: var(--accent-pink);
            border-radius: 16px;
            cursor: pointer;
            background: transparent;
            border: none;
        }

        .nav-tab.active {
            background-color: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* カレンダーコントロール */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .cal-btn {
            background-color: #ffffff;
            border: 1px solid var(--light-pink);
            color: var(--accent-pink);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
        }

        .current-month {
            font-size: 15px;
            font-weight: bold;
            color: var(--accent-pink);
        }

        /* 管理者専用パネル */
        .admin-panel {
            background-color: #fff0f3;
            border: 1px dashed var(--accent-pink);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 16px;
            display: none;
        }

        .admin-panel.show {
            display: block;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .admin-panel h3 {
            font-size: 12px;
            color: var(--accent-pink);
        }

        .admin-logout-btn {
            background: none;
            border: none;
            color: var(--gray-text);
            font-size: 11px;
            cursor: pointer;
            text-decoration: underline;
        }

        .admin-form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 8px;
        }

        .admin-form-group input, .admin-form-group textarea {
            padding: 6px 10px;
            border: 1px solid #ffb6c1;
            border-radius: 8px;
            font-size: 12px;
            outline: none;
            width: 100%;
        }

        .add-event-btn {
            background-color: var(--accent-pink);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        /* カレンダー本体グリッド */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .weekdays {
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            color: var(--accent-pink);
            padding-bottom: 6px;
        }

        .day-cell {
            background-color: #ffffff;
            border: 1px solid var(--gray-border);
            border-radius: 8px;
            min-height: 80px;
            padding: 4px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .day-cell:hover {
            background-color: var(--pale-pink);
        }

        .day-number {
            font-size: 11px;
            color: var(--text-color);
        }

        .event-badge {
            background-color: var(--accent-pink);
            color: white;
            font-size: 9px;
            padding: 3px 6px;
            border-radius: 4px;
            margin-top: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ポップアップ（モーダル）画面スタイル */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: var(--pale-pink);
            width: 100%;
            max-width: 480px;
            max-height: 80vh;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 16px;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }

        .modal-overlay.show .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            font-weight: bold;
            color: var(--accent-pink);
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid #ffd1dc;
        }

        .modal-close-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: var(--text-color);
        }

        .detail-card {
            background-color: #ffffff;
            border: 1px solid #ffd1dc;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 2px 6px rgba(255, 64, 129, 0.05);
        }

        .detail-category {
            fn-size: 10px;
            color: var(--gray-text);
            margin-bottom: 4px;
            font-size: 10px;
        }

        .detail-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 6px;
        }

        .detail-desc {
            font-size: 12px;
            color: #555555;
            margin-bottom: 10px;
            white-space: pre-wrap;
        }

        .detail-tag {
            display: inline-block;
            background-color: var(--light-pink);
            color: var(--accent-pink);
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
        }

        .delete-event-btn {
            background-color: #ffcccc;
            border: none;
            color: #d9534f;
            font-size: 10px;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            float: right;
        }

        /* フッター */
        .footer {
            margin-top: 24px;
            padding-top: 12px;
            border-top: 1px solid var(--gray-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            color: var(--gray-text);
        }

        .secret-admin-trigger {
            color: #dddddd;
            cursor: pointer;
            user-select: none;
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <div class="header">
            <div class="header-title" id="headerTitle">
                <span>💖 橋本将生 Schedule</span>
            </div>
            <div class="header-buttons">
                <!-- 更新ボタン（アイコン付き） -->
                <button class="action-btn" id="refreshBtn" onclick="manualReload()" title="最新情報を読み込む">
                    <span id="refreshIcon">🔄</span> 更新
                </button>
                <button class="action-btn">🔔 通知</button>
            </div>
        </div>

        <div class="countdown-banner">
            <div class="countdown-tag">⚡ 映画公開カウントダウン</div>
            <div class="countdown-text">映画『お姉ちゃんの翠くん』公開まで あと 67 日！ (12/4公開)</div>
        </div>

        <div class="profile-card">
            <div class="profile-info">
                <div class="profile-avatar">💖</div>
                <div>
                    <div class="profile-name">橋本将生 (Masaki Hashimoto)</div>
                    <div class="profile-sub">プロフィール＆関連リンクまとめ</div>
                </div>
            </div>
            <button class="profile-toggle">開く ▼</button>
        </div>

        <div class="nav-tabs">
            <button class="nav-tab active">MAGAZINE</button>
            <button class="nav-tab">番組/映画</button>
            <button class="nav-tab">イベント</button>
            <button class="nav-tab">ココまさき</button>
        </div>

        <!-- 管理者専用パネル -->
        <div class="admin-panel" id="adminPanel">
            <div class="admin-header">
                <h3>🛠️ 管理者モード (詳細付き予定の追加)</h3>
                <button class="admin-logout-btn" onclick="logoutAdmin()">ログアウト</button>
            </div>
            <div class="admin-form-group">
                <input type="number" id="eventDay" placeholder="日付 (例: 1)" min="1" max="31">
                <input type="text" id="eventCategory" placeholder="カテゴリ (例: 終日 雑誌)">
                <input type="text" id="eventTitle" placeholder="タイトル (例: 日本映画navi vol.125)">
                <textarea id="eventDesc" placeholder="詳細説明 (例: 【現場・製作・イベントリポート】\n橋本将生\n映画「お姉ちゃんの翠くん」)" rows="3"></textarea>
            </div>
            <button class="add-event-btn" onclick="addEvent()">詳細付きの予定を追加</button>
        </div>

        <div class="calendar-header">
            <button class="cal-btn">&lt; 前の月</button>
            <div class="current-month">2026年10月</div>
            <div style="display: flex; gap: 4px;">
                <button class="cal-btn">今月</button>
                <button class="cal-btn">次の月 &gt;</button>
            </div>
        </div>

        <div class="calendar-grid" id="calendarGrid"></div>

        <div class="footer">
            <span>&copy; Masaki Hashimoto Schedule</span>
            <span class="secret-admin-trigger" onclick="tryAdminLogin()" title="Admin">⚙</span>
        </div>
    </div>

    <!-- ポップアップ詳細モーダル -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal-content" id="modalContent">
            <div class="modal-header">
                <span id="modalDateTitle">2026年10月1日(木)</span>
                <button class="modal-close-btn" onclick="closeModalDirect()">×</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        let events = {
            1: [
                {
                    category: "終日 雑誌",
                    title: "日本映画navi vol.125",
                    desc: "【現場・製作・イベントリポート】\n橋本将生\n映画「お姉ちゃんの翠くん」"
                },
                {
                    category: "終日 雑誌",
                    title: "J Movie Magazine Vol.135",
                    desc: "【新作現場レポート】\n橋本将生 『お姉ちゃんの翠くん』"
                }
            ]
        };

        let isAdmin = false;
        const ADMIN_PASSWORD = "oshi";

        // ① アプリを開いたとき（読み込み時）に自動でキャッシュを無視して最新データを取得する処理
        window.addEventListener('load', () => {
            // ホーム画面から起動された、または再訪問された際に最新の状態をチェック
            console.log("アプリが起動しました：最新情報を確認中...");
        });

        // ② 手動更新ボタンが押されたときの処理（アイコンを回転させながら強制リロード）
        function manualReload() {
            const icon = document.getElementById("refreshIcon");
            icon.classList.add("spin");
            
            setTimeout(() => {
                // ブラウザのキャッシュを完全にクリアしてサーバーから強制再読み込み
                window.location.reload(true);
            }, 500);
        }

        function renderCalendar() {
            const grid = document.getElementById("calendarGrid");
            const weekdaysHTML = `
                <div class="weekdays" style="color: #ff4081;">日</div>
                <div class="weekdays">月</div>
                <div class="weekdays">火</div>
                <div class="weekdays">水</div>
                <div class="weekdays">木</div>
                <div class="weekdays">金</div>
                <div class="weekdays">土</div>
            `;
            grid.innerHTML = weekdaysHTML;

            for (let i = 27; i <= 30; i++) {
                grid.innerHTML += `<div class="day-cell" style="opacity: 0.5;"><span class="day-number">${i}</span></div>`;
            }

            for (let day = 1; day <= 31; day++) {
                let eventHtml = "";
                if (events[day]) {
                    events[day].forEach((ev) => {
                        eventHtml += `<div class="event-badge">${ev.title}</div>`;
                    });
                }

                grid.innerHTML += `
                    <div class="day-cell" onclick="openDayModal(${day})">
                        <span class="day-number">${day}</span>
                        ${eventHtml}
                    </div>
                `;
            }
        }

        function openDayModal(day) {
            const overlay = document.getElementById("modalOverlay");
            const dateTitle = document.getElementById("modalDateTitle");
            const modalBody = document.getElementById("modalBody");

            dateTitle.innerText = `2026年10月${day}日`;
            modalBody.innerHTML = "";

            if (!events[day] || events[day].length === 0) {
                modalBody.innerHTML = `<div style="text-align: center; color: var(--gray-text); padding: 20px; font-size: 13px;">この日の予定はありません</div>`;
            } else {
                events[day].forEach((ev, index) => {
                    let deleteBtnHtml = isAdmin ? `<button class="delete-event-btn" onclick="deleteEvent(${day}, ${index}, event)">削除</button>` : "";
                    
                    modalBody.innerHTML += `
                        <div class="detail-card">
                            ${deleteBtnHtml}
                            <div class="detail-category">${ev.category || "終日"}</div>
                            <div class="detail-title">${ev.title}</div>
                            <div class="detail-desc">${ev.desc || ""}</div>
                            <span class="detail-tag">橋本</span>
                        </div>
                    `;
                });
            }

            overlay.classList.add("show");
        }

        function closeModal(e) {
            if (e.target.id === "modalOverlay") {
                document.getElementById("modalOverlay").classList.remove("show");
            }
        }

        function closeModalDirect() {
            document.getElementById("modalOverlay").classList.remove("show");
        }

        function tryAdminLogin() {
            if (isAdmin) return;
            let pass = prompt("パスワードを入力してください:");
            if (pass === ADMIN_PASSWORD) {
                isAdmin = true;
                document.getElementById("adminPanel").classList.add("show");
                alert("管理者としてログインしました。");
                renderCalendar();
            } else if (pass !== null) {
                alert("パスワードが違います。");
            }
        }

        function logoutAdmin() {
            isAdmin = false;
            document.getElementById("adminPanel").classList.remove("show");
            alert("ログアウトしました。");
            renderCalendar();
        }

        let clickCount = 0;
        let clickTimer = null;
        document.getElementById("headerTitle").addEventListener("click", function() {
            clickCount++;
            clearTimeout(clickTimer);
            if (clickCount >= 3) {
                clickCount = 0;
                tryAdminLogin();
            } else {
                clickTimer = setTimeout(() => { clickCount = 0; }, 800);
            }
        });

        function addEvent() {
            const day = document.getElementById("eventDay").value;
            const category = document.getElementById("eventCategory").value;
            const title = document.getElementById("eventTitle").value;
            const desc = document.getElementById("eventDesc").value;

            if (!day || !title) {
                alert("日付とタイトルは必須です。");
                return;
            }

            if (!events[day]) {
                events[day] = [];
            }
            events[day].push({ category, title, desc });

            document.getElementById("eventDay").value = "";
            document.getElementById("eventCategory").value = "";
            document.getElementById("eventTitle").value = "";
            document.getElementById("eventDesc").value = "";

            renderCalendar();
            document.getElementById("modalOverlay").classList.remove("show");
            alert("予定を追加しました！");
        }

        function deleteEvent(day, index, e) {
            e.stopPropagation();
            if (confirm("この予定を削除しますか？")) {
                events[day].splice(index, 1);
                if (events[day].length === 0) {
                    delete events[day];
                }
                renderCalendar();
                document.getElementById("modalOverlay").classList.remove("show");
            }
        }

        renderCalendar();
    </script>
</body>
</html>
